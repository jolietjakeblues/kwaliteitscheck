name: Dagelijkse kwaliteitscheck

# Draait de checks, rendert het dashboard en publiceert het op GitHub Pages.
# Er wordt niets naar de repo gecommit: de historie leeft in de gepubliceerde
# site (data/historie.csv). Elke run haalt die op, voegt een run toe en
# publiceert opnieuw. De CSV's in de repo dienen alleen als startpunt.

on:
  schedule:
    # 05:30 UTC = 07:30 zomertijd / 06:30 wintertijd, na de verversing van CHO-KENNIS (~04:45 UTC)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Historie ophalen van de gepubliceerde site
        run: |
          for f in historie.csv graphs_historie.csv; do
            if curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f" -o "/tmp/$f"; then
              mv "/tmp/$f" "data/$f"
              echo "data/$f opgehaald van de site"
            else
              echo "data/$f niet op de site gevonden, start vanaf de versie in de repo"
            fi
          done

      - name: Checks draaien
        run: python kwaliteit.py

      - name: Dashboard renderen
        run: |
          mkdir -p site/data
          jupyter nbconvert --to html --execute --no-input dashboard.ipynb --output-dir site --output index
          cp data/historie.csv data/graphs_historie.csv site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
